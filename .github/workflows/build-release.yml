name: Build font and release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "*.*.*"
  pull_request:

concurrency:
  group: font-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  IBM_PLEX_VERSION: "1.1.1"
  IBM_PLEX_SOURCE_ARCHIVE_SHA256: "93649217ac3222b2117175b4fcb862636e571595f5fd3a42a27c04520ccba139"
  IBM_PLEX_SOURCE_SHA256: "e0c01d20fb8afa5710b4856edff73f6089adf02b4846146b5837c38d95d0c66f"
  IBM_PLEX_SOURCE_ARCHIVE: .cache/ibm-plex-sans-tc/ibm-plex-sans-tc-sources-1.1.1.zip
  UPSTREAM_SOURCE: vendor/ibm-plex-sans-tc/sources/masters/IBM Plex Sans TC.glyphs
  DERIVED_SOURCE: build/source/Kumamaru Sans.glyphs
  VARIABLE_FONT: build/source/variable-ttf/KumamaruSans[wght].ttf

jobs:
  prepare:
    name: Prepare transformed font source
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[source,dev]'

      - name: Verify source and tag versions
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          PROJECT_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          MODULE_VERSION="$(python -c 'import kumamaru; print(kumamaru.__version__)')"
          CONFIG_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("config/regular.toml", "rb"))["font"]["version"])')"
          [[ "${PROJECT_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "${PROJECT_VERSION}" = "${MODULE_VERSION}"
          test "${PROJECT_VERSION}" = "${CONFIG_VERSION}"
          if [ -n "${RELEASE_TAG}" ]; then
            test "${RELEASE_TAG}" = "${PROJECT_VERSION}"
          fi
          echo "version=${PROJECT_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Lint and run tests
        run: |
          make lint
          make test

      - name: Restore pinned IBM Plex Sans TC source archive
        uses: actions/cache@v6
        with:
          path: .cache/ibm-plex-sans-tc
          key: ibm-plex-sans-tc-sources-${{ env.IBM_PLEX_VERSION }}-${{ env.IBM_PLEX_SOURCE_ARCHIVE_SHA256 }}

      - name: Download and verify official upstream source
        run: |
          mkdir -p "$(dirname "${IBM_PLEX_SOURCE_ARCHIVE}")"
          mkdir -p "$(dirname "${UPSTREAM_SOURCE}")"
          if [ ! -s "${IBM_PLEX_SOURCE_ARCHIVE}" ]; then
            curl --fail --location --retry 3 --output "${IBM_PLEX_SOURCE_ARCHIVE}" \
              "https://github.com/IBM/plex/releases/download/%40ibm/plex-sans-tc%401.1.1/sources.zip"
          fi
          echo "${IBM_PLEX_SOURCE_ARCHIVE_SHA256}  ${IBM_PLEX_SOURCE_ARCHIVE}" \
            | sha256sum --check -
          unzip -jo "${IBM_PLEX_SOURCE_ARCHIVE}" \
            "sources/masters/IBM Plex Sans TC.glyphs" \
            -d "$(dirname "${UPSTREAM_SOURCE}")"
          test -s "${UPSTREAM_SOURCE}"
          echo "${IBM_PLEX_SOURCE_SHA256}  ${UPSTREAM_SOURCE}" | sha256sum --check -

      - name: Inspect and transform all source masters
        run: |
          make source-inspect PYTHON=python
          test -s build/source/manifest.json
          make source-round PYTHON=python
          test -s "${DERIVED_SOURCE}"
          test -s build/source/rounding-report.json

      - name: Upload transformed source
        uses: actions/upload-artifact@v7
        with:
          name: transformed-source
          path: |
            build/source/Kumamaru Sans.glyphs
            build/source/manifest.json
            build/source/rounding-report.json
          if-no-files-found: error
          retention-days: 1

  build-static:
    name: Build static ${{ matrix.weight }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        weight:
          - Thin
          - ExtraLight
          - Light
          - Regular
          - Text
          - Medium
          - SemiBold
          - Bold

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and source dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[source]'

      - name: Download transformed source
        uses: actions/download-artifact@v8
        with:
          name: transformed-source
          path: build/source

      - name: Build ${{ matrix.weight }} static font
        env:
          WEIGHT: ${{ matrix.weight }}
        run: |
          make source-build-instance PYTHON=python INSTANCE="Kumamaru Sans ${WEIGHT}"
          test "$(find build/source/instance-ttf -maxdepth 1 -type f -name '*.ttf' | wc -l)" -eq 1
          test -s "build/source/instance-ttf/KumamaruSans-${WEIGHT}.ttf"

      - name: Upload ${{ matrix.weight }} static font
        uses: actions/upload-artifact@v7
        with:
          name: static-font-${{ matrix.weight }}
          path: build/source/instance-ttf/KumamaruSans-${{ matrix.weight }}.ttf
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  build-variable:
    name: Build variable font
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and source dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[source]'

      - name: Download transformed source
        uses: actions/download-artifact@v8
        with:
          name: transformed-source
          path: build/source

      - name: Build variable font
        run: |
          make source-build-variable PYTHON=python
          test -s "${VARIABLE_FONT}"

      - name: Upload variable font
        uses: actions/upload-artifact@v7
        with:
          name: variable-font
          path: ${{ env.VARIABLE_FONT }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  package:
    name: Validate and package release assets
    needs:
      - prepare
      - build-static
      - build-variable
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Download source reports
        uses: actions/download-artifact@v8
        with:
          name: transformed-source
          path: build/source

      - name: Download static fonts
        uses: actions/download-artifact@v8
        with:
          pattern: static-font-*
          path: build/source/instance-ttf
          merge-multiple: true

      - name: Download variable font
        uses: actions/download-artifact@v8
        with:
          name: variable-font
          path: build/source/variable-ttf

      - name: Validate source build contract
        run: |
          test "$(find build/source/instance-ttf -maxdepth 1 -type f -name '*.ttf' | wc -l)" -eq 8
          test -s "${VARIABLE_FONT}"
          python -m kumamaru.source_validation \
            build/source/instance-ttf \
            "${VARIABLE_FONT}" \
            --config config/regular.toml

      - name: Run release-critical FontBakery checks
        run: make source-fontbakery PYTHON=python

      - name: Package release assets
        run: |
          PACKAGE_DIR="dist/KumamaruSans-${VERSION}"
          mkdir -p "${PACKAGE_DIR}/Static" "${PACKAGE_DIR}/Variable" "${PACKAGE_DIR}/Reports"
          cp build/source/instance-ttf/*.ttf "${PACKAGE_DIR}/Static/"
          cp "${VARIABLE_FONT}" "${PACKAGE_DIR}/Variable/"
          cp build/source/manifest.json build/source/rounding-report.json \
            build/source/fontbakery.json "${PACKAGE_DIR}/Reports/"
          cp README.md "${PACKAGE_DIR}/"
          cp LICENSES/OFL-1.1.txt LICENSES/UPSTREAM.md "${PACKAGE_DIR}/"
          (
            cd "${PACKAGE_DIR}"
            find Static Variable Reports -type f -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          (
            cd dist
            zip -r "KumamaruSans-${VERSION}.zip" "KumamaruSans-${VERSION}"
            cp "KumamaruSans-${VERSION}/Static/"*.ttf .
            cp "KumamaruSans-${VERSION}/Variable/"*.ttf .
            sha256sum -- *.ttf "KumamaruSans-${VERSION}.zip" > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: kumamaru-sans-build
          path: |
            dist/*.ttf
            dist/KumamaruSans-*.zip
            dist/SHA256SUMS
            dist/KumamaruSans-*/README.md
            dist/KumamaruSans-*/OFL-1.1.txt
            dist/KumamaruSans-*/UPSTREAM.md
            dist/KumamaruSans-*/SHA256SUMS
            dist/KumamaruSans-*/Reports/*.json
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@v8
        with:
          name: kumamaru-sans-build
          path: release

      - name: Publish release for the existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(find release -maxdepth 1 -type f -name '*.ttf' | wc -l)" -eq 9
          test -s "release/KumamaruSans-${GITHUB_REF_NAME}.zip"
          test -s release/SHA256SUMS
          gh release create "${GITHUB_REF_NAME}" \
            release/*.ttf \
            "release/KumamaruSans-${GITHUB_REF_NAME}.zip" \
            release/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "Kumamaru Sans ${GITHUB_REF_NAME}"
